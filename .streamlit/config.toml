[theme]
base = "dark"
primaryColor = "#3ee0c5"
backgroundColor = "#070b12"
secondaryBackgroundColor = "#101820"
textColor = "#d7ece8"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
folderWatchBlacklist = ["data"]
headless = true
fileWatcherType = "none"
